---
name: Test DELETE JSONbin
on:
  workflow_dispatch:
jobs:
  test-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Skip if no API key
        id: check-key
        env:
          API_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "WARNING: JSONBIN_API_KEY secret not set, skipping live API test"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a bin first (to get a valid bin_id for DELETE)
        if: steps.check-key.outputs.skip == 'false'
        id: create
        uses: .
        with:
          api_key: ${{ secrets.JSONBIN_API_KEY }}
          method: CREATE
          body: '{"test": "delete-scenario", "ephemeral": true}'

      - name: DELETE the created bin
        if: steps.check-key.outputs.skip == 'false'
        id: action
        uses: .
        with:
          api_key: ${{ secrets.JSONBIN_API_KEY }}
          method: DELETE
          bin_id: ${{ steps.create.outputs.bin_id }}

      - name: Assert bin_id is set after DELETE
        if: steps.check-key.outputs.skip == 'false'
        env:
          BIN_ID: ${{ steps.action.outputs.bin_id }}
        run: |
          echo "bin_id: $BIN_ID"
          if [ -z "$BIN_ID" ]; then
            echo "FAIL: expected bin_id to be non-empty after DELETE"
            exit 1
          fi
          echo "PASS: bin_id is set to $BIN_ID"

      - name: Assert bin_id matches the created bin
        if: steps.check-key.outputs.skip == 'false'
        env:
          CREATED_BIN_ID: ${{ steps.create.outputs.bin_id }}
          DELETED_BIN_ID: ${{ steps.action.outputs.bin_id }}
        run: |
          echo "created bin_id: $CREATED_BIN_ID"
          echo "deleted bin_id: $DELETED_BIN_ID"
          if [ "$DELETED_BIN_ID" = "$CREATED_BIN_ID" ]; then
            echo "PASS: DELETE returned the same bin_id as CREATE"
          else
            echo "FAIL: DELETE bin_id '$DELETED_BIN_ID' does not match created bin_id '$CREATED_BIN_ID'"
            exit 1
          fi

      - name: Assert url is set and correct
        if: steps.check-key.outputs.skip == 'false'
        env:
          BIN_ID: ${{ steps.action.outputs.bin_id }}
          URL: ${{ steps.action.outputs.url }}
        run: |
          echo "bin_id: $BIN_ID"
          echo "url: $URL"
          EXPECTED_URL="https://api.jsonbin.io/v3/b/${BIN_ID}"
          if [ "$URL" = "$EXPECTED_URL" ]; then
            echo "PASS: url matches expected pattern"
          else
            echo "FAIL: url '$URL' does not match expected '$EXPECTED_URL'"
            exit 1
          fi

      - name: Skip notice
        if: steps.check-key.outputs.skip == 'true'
        run: |
          echo "Test skipped: JSONBIN_API_KEY secret not configured"
          echo "To run this test, add JSONBIN_API_KEY as a repository secret"
