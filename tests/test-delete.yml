---
name: Test DELETE method
on:
  workflow_dispatch:
jobs:
  test-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_key: "fake-api-key-for-testing"
          method: "DELETE"
          bin_id: "000000000000000000000000"
      - name: Assert action ran (outputs set, or failed gracefully with fake API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BIN_ID: ${{ steps.action.outputs.bin_id }}
          URL: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bin_id: $BIN_ID"
          echo "url: $URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BIN_ID" ]; then
              echo "FAIL: action succeeded but bin_id output is empty"
              exit 1
            fi
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            echo "PASS: got bin_id='$BIN_ID' url='$URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key / bin_id)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
