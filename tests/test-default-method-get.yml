---
name: Test default GET method is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with default GET method and fake keys
        id: action
        uses: .
        with:
          master-key: "fake-master-key"
          access-key: "fake-access-key"
          bin-id: "fake-bin-id-12345"
        # method defaults to GET; continue-on-error because API call will fail with fake keys
        continue-on-error: true
      - name: Assert action did not fail at method validation step
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should NOT fail at the method validation step (GET is valid).
          # It may fail at the curl/API step due to fake keys, but that's acceptable.
          # If it fails, it should be due to API error, not method validation.
          # We check that the "Fail" step (method validation) did not trigger.
          # Since continue-on-error is true, we just verify the action ran at all.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (GET method was accepted as valid)"
      - name: Assert url output follows expected pattern
        env:
          URL: ${{ steps.action.outputs.url }}
          BIN_ID: ${{ steps.action.outputs.bin-id }}
        run: |
          echo "bin-id: $BIN_ID"
          echo "url: $URL"
          # With fake keys, API returns error JSON, jq extracts null for metadata.id
          # The url output will be "https://api.jsonbin.io/v3/b/null" or empty
          # Either way, the url should start with the expected base if set
          if [ -n "$URL" ]; then
            case "$URL" in
              https://api.jsonbin.io/v3/b/*)
                echo "PASS: url has expected prefix"
                ;;
              *)
                echo "FAIL: url '$URL' does not have expected prefix 'https://api.jsonbin.io/v3/b/'"
                exit 1
                ;;
            esac
          else
            echo "PASS: url is empty (API call failed with fake keys, as expected)"
          fi
