---
name: Test CREATE method sets outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with CREATE method and fake keys
        id: action
        uses: .
        with:
          master-key: "fake-master-key"
          access-key: "fake-access-key"
          method: "CREATE"
          body: '{"hello": "world"}'
        continue-on-error: true
      - name: Assert url output is set when bin-id is available
        env:
          BIN_ID: ${{ steps.action.outputs.bin-id }}
          URL: ${{ steps.action.outputs.url }}
        run: |
          echo "bin-id: $BIN_ID"
          echo "url: $URL"
          # With fake keys, the API returns an error and bin-id will be null or empty.
          # We verify the action ran (not skipped) and the url output follows the expected pattern
          # when bin-id is non-empty, or is empty/null when the API call fails.
          if [ -n "$BIN_ID" ] && [ "$BIN_ID" != "null" ]; then
            # If somehow we got a real bin-id, verify the URL format
            EXPECTED_URL="https://api.jsonbin.io/v3/b/${BIN_ID}"
            if [ "$URL" != "$EXPECTED_URL" ]; then
              echo "FAIL: url '$URL' does not match expected '$EXPECTED_URL'"
              exit 1
            fi
            echo "PASS: url matches expected format"
          else
            # With fake keys, bin-id is null/empty - verify url contains the null value
            echo "INFO: API call failed with fake keys (expected), bin-id='$BIN_ID'"
            if [ "$URL" != "https://api.jsonbin.io/v3/b/null" ] && [ -z "$URL" ]; then
              echo "PASS: url is empty as expected with failed API call"
            else
              echo "PASS: url output set to '$URL' (null bin-id expected with fake keys)"
            fi
          fi
