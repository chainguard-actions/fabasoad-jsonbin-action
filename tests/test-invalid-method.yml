name: Test invalid method fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid method (expect failure)
        id: action
        uses: .
        with:
          master-key: "fake-master-key"
          access-key: "fake-access-key"
          method: "PATCH"
        continue-on-error: true
      - name: Assert action failed for invalid method
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unsupported method PATCH, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported method"
