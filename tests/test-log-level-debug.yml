---
name: Test debug log level is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with debug log level
        id: action
        uses: .
        with:
          master-key: "fake-master-key"
          access-key: "fake-access-key"
          method: "GET"
          bin-id: "fake-bin-id"
          log-level: "debug"
        # The action will fail at the API call (fake keys), but NOT at validation
        continue-on-error: true
      - name: Assert action did not fail due to method validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should NOT fail with "method is not supported" error.
          # It may fail at the API call level (fake keys), but that's expected.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: GET method with debug log level passed validation"
