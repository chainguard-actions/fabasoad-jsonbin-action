name: Test UPDATE method
on:
  workflow_dispatch:
jobs:
  test-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock HTTP server for UPDATE
        run: |
          python3 -c "
          import http.server
          import json
          import threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_PUT(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length)
                  response = json.dumps({
                      'record': {'name': 'updated'},
                      'metadata': {
                          'id': 'updated-version-id',
                          'parentId': 'original-bin-id-555',
                          'createdAt': '2024-01-02T00:00:00.000Z',
                          'private': True
                      }
                  })
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(response)))
                  self.end_headers()
                  self.wfile.write(response.encode())
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 8765), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time
          time.sleep(60)
          " &
          sleep 1
          echo "Mock server started"

      - name: Patch hosts to redirect api.jsonbin.io to mock server
        run: |
          echo "127.0.0.1 api.jsonbin.io" | sudo tee -a /etc/hosts
          echo "Hosts patched"

      - id: action
        uses: .
        with:
          api_key: "$mock-api-key$"
          method: "UPDATE"
          bin_id: "original-bin-id-555"
          body: '{"name": "updated", "value": 99}'
        continue-on-error: true

      - name: Assert UPDATE outputs
        env:
          BIN_ID: ${{ steps.action.outputs.bin_id }}
          URL: ${{ steps.action.outputs.url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bin_id: $BIN_ID"
          echo "url: $URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BIN_ID" ]; then
              echo "FAIL: bin_id should not be empty on success"
              exit 1
            fi
            if [ -z "$URL" ]; then
              echo "FAIL: url should not be empty on success"
              exit 1
            fi
            # For UPDATE, bin_id comes from metadata.parentId
            echo "PASS: UPDATE succeeded with bin_id=$BIN_ID url=$URL"
          else
            echo "Action failed (expected without real API key)"
            echo "PASS: action was invoked correctly with UPDATE method"
          fi
