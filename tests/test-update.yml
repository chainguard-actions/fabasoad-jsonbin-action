---
name: Test UPDATE JSONbin
on:
  workflow_dispatch:
jobs:
  test-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Skip if no API key
        id: check-key
        env:
          API_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "WARNING: JSONBIN_API_KEY secret not set, skipping live API test"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a bin first (to get a valid bin_id for UPDATE)
        if: steps.check-key.outputs.skip == 'false'
        id: create
        uses: .
        with:
          api_key: ${{ secrets.JSONBIN_API_KEY }}
          method: CREATE
          body: '{"test": "update-scenario", "version": 1}'

      - name: UPDATE the created bin
        if: steps.check-key.outputs.skip == 'false'
        id: action
        uses: .
        with:
          api_key: ${{ secrets.JSONBIN_API_KEY }}
          method: UPDATE
          bin_id: ${{ steps.create.outputs.bin_id }}
          body: '{"test": "update-scenario", "version": 2}'

      - name: Assert bin_id is set after UPDATE
        if: steps.check-key.outputs.skip == 'false'
        env:
          BIN_ID: ${{ steps.action.outputs.bin_id }}
        run: |
          echo "bin_id: $BIN_ID"
          if [ -z "$BIN_ID" ]; then
            echo "FAIL: expected bin_id to be non-empty after UPDATE"
            exit 1
          fi
          echo "PASS: bin_id is set to $BIN_ID"

      - name: Assert bin_id matches the created bin
        if: steps.check-key.outputs.skip == 'false'
        env:
          CREATED_BIN_ID: ${{ steps.create.outputs.bin_id }}
          UPDATED_BIN_ID: ${{ steps.action.outputs.bin_id }}
        run: |
          echo "created bin_id: $CREATED_BIN_ID"
          echo "updated bin_id: $UPDATED_BIN_ID"
          if [ "$UPDATED_BIN_ID" = "$CREATED_BIN_ID" ]; then
            echo "PASS: UPDATE returned the same bin_id as CREATE (parentId matches)"
          else
            echo "FAIL: UPDATE bin_id '$UPDATED_BIN_ID' does not match created bin_id '$CREATED_BIN_ID'"
            exit 1
          fi

      - name: Assert url is set and correct
        if: steps.check-key.outputs.skip == 'false'
        env:
          BIN_ID: ${{ steps.action.outputs.bin_id }}
          URL: ${{ steps.action.outputs.url }}
        run: |
          echo "bin_id: $BIN_ID"
          echo "url: $URL"
          EXPECTED_URL="https://api.jsonbin.io/v3/b/${BIN_ID}"
          if [ "$URL" = "$EXPECTED_URL" ]; then
            echo "PASS: url matches expected pattern"
          else
            echo "FAIL: url '$URL' does not match expected '$EXPECTED_URL'"
            exit 1
          fi

      - name: Skip notice
        if: steps.check-key.outputs.skip == 'true'
        run: |
          echo "Test skipped: JSONBIN_API_KEY secret not configured"
          echo "To run this test, add JSONBIN_API_KEY as a repository secret"
