name: Test CREATE method
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test CREATE method fails with invalid API key
        id: action
        uses: .
        with:
          api_key: "fake-api-key-for-testing"
          method: "CREATE"
          body: '{"test": "value"}'
        continue-on-error: true
      - name: Assert action failed with invalid API key
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key"
