---
name: Test GET JSONbin
on:
  workflow_dispatch:
jobs:
  test-get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Skip if no API key
        id: check-key
        env:
          API_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "WARNING: JSONBIN_API_KEY secret not set, skipping live API test"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a bin first (to get a valid bin_id for GET)
        if: steps.check-key.outputs.skip == 'false'
        id: create
        uses: .
        with:
          api_key: ${{ secrets.JSONBIN_API_KEY }}
          method: CREATE
          body: '{"test": "get-scenario", "hello": "world"}'

      - name: GET the created bin
        if: steps.check-key.outputs.skip == 'false'
        id: action
        uses: .
        with:
          api_key: ${{ secrets.JSONBIN_API_KEY }}
          method: GET
          bin_id: ${{ steps.create.outputs.bin_id }}

      - name: Assert bin_id matches
        if: steps.check-key.outputs.skip == 'false'
        env:
          CREATED_BIN_ID: ${{ steps.create.outputs.bin_id }}
          GOT_BIN_ID: ${{ steps.action.outputs.bin_id }}
        run: |
          echo "created bin_id: $CREATED_BIN_ID"
          echo "got bin_id: $GOT_BIN_ID"
          if [ -z "$GOT_BIN_ID" ]; then
            echo "FAIL: expected bin_id to be non-empty after GET"
            exit 1
          fi
          if [ "$GOT_BIN_ID" = "$CREATED_BIN_ID" ]; then
            echo "PASS: GET returned the same bin_id as CREATE"
          else
            echo "FAIL: GET bin_id '$GOT_BIN_ID' does not match created bin_id '$CREATED_BIN_ID'"
            exit 1
          fi

      - name: Assert url is set and correct
        if: steps.check-key.outputs.skip == 'false'
        env:
          BIN_ID: ${{ steps.action.outputs.bin_id }}
          URL: ${{ steps.action.outputs.url }}
        run: |
          echo "bin_id: $BIN_ID"
          echo "url: $URL"
          EXPECTED_URL="https://api.jsonbin.io/v3/b/${BIN_ID}"
          if [ "$URL" = "$EXPECTED_URL" ]; then
            echo "PASS: url matches expected pattern"
          else
            echo "FAIL: url '$URL' does not match expected '$EXPECTED_URL'"
            exit 1
          fi

      - name: Skip notice
        if: steps.check-key.outputs.skip == 'true'
        run: |
          echo "Test skipped: JSONBIN_API_KEY secret not configured"
          echo "To run this test, add JSONBIN_API_KEY as a repository secret"
