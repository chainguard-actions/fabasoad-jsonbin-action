---
name: Test GET JSONbin
on:
  workflow_dispatch:
jobs:
  test-get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check API key availability
        env:
          API_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "SKIP: JSONBIN_API_KEY secret is not set, skipping test"
            echo "JSONBIN_SKIP=true" >> $GITHUB_ENV
          else
            echo "JSONBIN_SKIP=false" >> $GITHUB_ENV
          fi
      - name: Create JSONbin to get a bin_id
        if: env.JSONBIN_SKIP == 'false'
        id: create
        uses: .
        with:
          api_key: ${{ secrets.JSONBIN_API_KEY }}
          method: CREATE
          body: '{"test": "hello", "scenario": "get"}'
      - name: Assert create succeeded
        if: env.JSONBIN_SKIP == 'false'
        env:
          BIN_ID: ${{ steps.create.outputs.bin_id }}
        run: |
          echo "created bin_id: $BIN_ID"
          if [ -z "$BIN_ID" ]; then
            echo "FAIL: create step did not produce a bin_id"
            exit 1
          fi
          echo "PASS: bin created with id $BIN_ID"
      - name: Get JSONbin
        if: env.JSONBIN_SKIP == 'false'
        id: action
        uses: .
        with:
          api_key: ${{ secrets.JSONBIN_API_KEY }}
          method: GET
          bin_id: ${{ steps.create.outputs.bin_id }}
      - name: Assert bin_id matches
        if: env.JSONBIN_SKIP == 'false'
        env:
          CREATED_BIN_ID: ${{ steps.create.outputs.bin_id }}
          GOT_BIN_ID: ${{ steps.action.outputs.bin_id }}
        run: |
          echo "created bin_id: $CREATED_BIN_ID"
          echo "got bin_id: $GOT_BIN_ID"
          if [ -z "$GOT_BIN_ID" ]; then
            echo "FAIL: bin_id output from GET is empty"
            exit 1
          fi
          if [ "$GOT_BIN_ID" = "$CREATED_BIN_ID" ]; then
            echo "PASS: bin_id matches"
          else
            echo "FAIL: bin_id mismatch: expected $CREATED_BIN_ID, got $GOT_BIN_ID"
            exit 1
          fi
      - name: Assert url is set
        if: env.JSONBIN_SKIP == 'false'
        env:
          URL: ${{ steps.action.outputs.url }}
          BIN_ID: ${{ steps.action.outputs.bin_id }}
        run: |
          echo "url: $URL"
          echo "bin_id: $BIN_ID"
          if [ -z "$URL" ]; then
            echo "FAIL: url output is empty"
            exit 1
          fi
          if echo "$URL" | grep -qF "$BIN_ID"; then
            echo "PASS: url contains bin_id"
          else
            echo "FAIL: url does not contain bin_id"
            exit 1
          fi
      - name: Skip notice
        if: env.JSONBIN_SKIP == 'true'
        run: |
          echo "Test skipped: JSONBIN_API_KEY secret not configured"
          echo "PASS: test skipped gracefully"
